# VULNERABLE WORKFLOW FOR TESTING DEPENDABOT CONFUSED DEPUTY BYPASS
# Attack: @dependabot recreate on fork PR makes github.actor = dependabot[bot]

name: Dependabot Bypass Test - Claude PR Review

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

jobs:
  claude-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write  # Required for GCP Workload Identity Federation
    
    # Vertex AI env vars must be at job level for composite action to access them
    env:
      ANTHROPIC_VERTEX_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      CLOUD_ML_REGION: "us-east5"  # Claude models only available in us-east5

    steps:
      - name: Checkout base repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1

      # Authenticate to GCP using service account key
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_VERTEX_AI_KEY }}

      - name: Run Claude Code Review
        uses: anthropics/claude-code-action@v1
        with:
          # Explicit github_token to avoid OIDC exchange failure
          github_token: ${{ secrets.GITHUB_TOKEN }}
          
          # Use Vertex AI instead of direct Anthropic API
          use_vertex: "true"
          # Must specify model for Vertex AI
          claude_args: "--model claude-sonnet-4-5@20250929"
          # Debug output
          show_full_output: "true"

          # VULNERABLE: dependabot is bypassable via Confused Deputy attack
          allowed_bots: "dependabot"

          prompt: |
            Review PR #${{ github.event.pull_request.number }} in ${{ github.repository }}.
            PR Title: ${{ github.event.pull_request.title }}
            PR Body: ${{ github.event.pull_request.body }}
            Use gh pr diff to see changes and provide feedback.
